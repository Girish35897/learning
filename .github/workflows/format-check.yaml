name: Python — Format & Lint Check

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  lint-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort ruff

      - name: Check isort
        run: isort --check-only .

      - name: Check black
        run: black --check .

      - name: Check ruff
        run: ruff check .
